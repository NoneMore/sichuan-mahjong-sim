[package]
name = "sichuan-mahjong-neural"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Versioned neural-policy decision encoding for the Sichuan mahjong simulator core"
license = "MIT"
publish = false

[lib]
name = "sichuan_mahjong_neural"
path = "src/lib.rs"

[dependencies]
# Direct exact pins plus the committed lockfile keep resolution within the
# Rust 1.75 MSRV. The `tempfile` default feature is unused and would add a
# random-source dependency.
fs4 = "=1.1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sichuan-mahjong-sim = { path = "../.." }
tempfile = { version = "=3.27.0", default-features = false }

[package]
name = "sichuan-mahjong-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Python environment binding for the Sichuan mahjong simulator and decision encoder"
publish = false

[lib]
name = "_native"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
# Test executables link Python normally; only extension builds suppress that
# linkage, as required for portable PyO3 extension-module builds.
extension-module = ["pyo3/extension-module"]

[dependencies]
# Pinned direct dependencies and a committed lockfile keep this independent
# extension build within the Rust 1.75 baseline. `rustc-hash` is pinned in the
# lockfile because newer releases raise their MSRV above 1.75.
numpy = "=0.23.0"
pyo3 = { version = "=0.23.5", features = ["abi3-py312"] }
sichuan-mahjong-neural = { path = "../neural" }
sichuan-mahjong-sim = { path = "../.." }

[build-dependencies]
# The build script hashes the extension, core, and neural source trees so the
# compiled identity does not rely on the caller's working directory.
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.9"

# The extension is intentionally outside the root workspace: ordinary core,
# collector, and neural builds never resolve or link Python.
[workspace]

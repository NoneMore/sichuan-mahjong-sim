[package]
name = "sichuan-mahjong-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic Sichuan mahjong (blood battle) simulator core"
license = "MIT"
publish = false

[lib]
name = "sichuan_mahjong_sim"
path = "src/lib.rs"

[dependencies]

[workspace]
members = [".", "crates/neural"]
default-members = [".", "crates/neural"]
# The PyO3 extension is its own workspace: normal core/collector builds must
# neither resolve nor link Python. See online/README.md.
exclude = ["crates/python"]
resolver = "2"

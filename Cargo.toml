[package]
name = "sichuan-mahjong-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic Sichuan mahjong (blood battle) simulator core"
publish = false

[lib]
name = "sichuan_mahjong_sim"
path = "src/lib.rs"

[dependencies]

# One-off experiment tooling only: `examples/policy_ab.rs` exchanges JSON with
# an external Python worker. The library itself has no runtime dependencies.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

name: Rust CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Stable / quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Clippy (all targets)
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Tests (Debug, all targets)
        run: cargo +stable test --all-targets --locked
      - name: Tests (Release, all targets)
        run: cargo +stable test --release --all-targets --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +stable doc --no-deps --locked

  msrv:
    name: MSRV / Rust 1.75.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.75.0 --profile minimal
      - name: Check all targets with MSRV
        run: cargo +1.75.0 check --all-targets --locked

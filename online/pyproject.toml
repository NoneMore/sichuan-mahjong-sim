[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "mahjong-eval"
version = "0.1.0"
description = "Online Sichuan mahjong environment binding for frozen-policy evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[tool.maturin]
manifest-path = "../crates/python/Cargo.toml"
python-source = "."
module-name = "mahjong_eval._native"
# Test executables link Python normally; wheels enable extension link mode.
features = ["extension-module"]

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:mahjong_eval.*"]

[project.optional-dependencies]
# `mahjong-bc` is a repository-local distribution, not a PyPI package. Install
# it first with `pip install -e ./python`; then this extra is already satisfied.
# A native-only install keeps working without it (the extension is imported
# lazily), but frozen inference and comparison need the offline package.
evaluation = ["mahjong-bc"]

[project.scripts]
mahjong-eval = "mahjong_eval.cli:main"
